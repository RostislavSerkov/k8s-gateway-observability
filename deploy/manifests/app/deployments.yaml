# Демо-приложение "hello": nginx (unprivileged) + sidecar nginx-prometheus-exporter.
# hello-v1 - основная версия (ответ "Hello World!"), hello-v2 - canary.
# Манифесты отличаются только именем, лейблом версии, числом реплик и ConfigMap версии.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-v1
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/version: v1
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/version: v1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/version: v1
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: hello
      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.29.8-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: app-version
          mountPath: /etc/nginx/app
          readOnly: true
        - name: tmp
          mountPath: /tmp
      - name: exporter
        image: nginx/nginx-prometheus-exporter:1.5.3
        imagePullPolicy: IfNotPresent
        args:
        - --nginx.scrape-uri=http://127.0.0.1:8081/stub_status
        - --web.listen-address=:9113
        ports:
        - name: metrics
          containerPort: 9113
        readinessProbe:
          httpGet:
            path: /metrics
            port: metrics
          periodSeconds: 15
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: nginx-conf
        configMap:
          name: hello-nginx-conf
      - name: app-version
        configMap:
          name: hello-version-v1
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
