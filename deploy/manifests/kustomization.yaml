apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Корневая сборка всех Kubernetes-ресурсов решения (kubectl apply -k deploy/manifests).
# Helm-чарты (Envoy Gateway, kube-prometheus-stack) ставятся отдельно scripts/02-platform.sh,
# т.к. эти ресурсы зависят от их CRD.
resources:
  - namespaces.yaml
  - app
  - gateway
  - logging
  - monitoring

labels:
  - pairs:
      app.kubernetes.io/part-of: gw-observability
    includeSelectors: false
