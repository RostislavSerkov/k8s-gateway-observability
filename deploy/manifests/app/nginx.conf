# nginx демо-приложения "hello". Общий конфиг для версий v1 и v2;
# отличия (версия и текст ответа) в /etc/nginx/app/version.conf.
# Рассчитан на образ nginx-unprivileged: non-root (uid 101), readOnlyRootFilesystem, запись только в /tmp.
worker_processes 2;
pid /tmp/nginx.pid;
# error-лог -> stderr контейнера -> файл в /var/log/containers -> Fluentd
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server_tokens off;
  default_type  text/plain;
  charset       utf-8;
  keepalive_timeout 65;

  # access-лог в JSON: Fluentd парсит его в отдельные поля (status, uri, request_time...)
  log_format json_access escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"request_id":"$http_x_request_id",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"protocol":"$server_protocol",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"host":"$host",'
      '"user_agent":"$http_user_agent",'
      '"app_version":"$app_version"'
    '}';

  server {
    listen 8080 default_server;
    server_name _;

    # $app_version и $app_message
    include /etc/nginx/app/version.conf;

    access_log /dev/stdout json_access;
    add_header X-App-Version $app_version always;

    # Проверка живости для kubelet (не засоряет access-лог)
    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Демонстрация HTTP 5xx (метрики кодов ответа и алерт High5xx)
    location = /error {
      return 500 "Internal Server Error (demo)\n";
    }

    location / {
      return 200 "$app_message\n";
    }
  }

  # stub_status только для sidecar nginx-prometheus-exporter (localhost пода)
  server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /stub_status {
      stub_status;
    }
  }
}
