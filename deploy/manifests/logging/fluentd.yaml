# Fluentd DaemonSet: читает логи контейнеров с ноды и отправляет их в OpenSearch.
# Образ fluent/fluentd-kubernetes-daemonset (вариант opensearch) уже содержит плагины
# opensearch, kubernetes_metadata, parser-cri, prometheus.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
---
# Только чтение метаданных подов/namespace для фильтра kubernetes_metadata
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd-read-metadata
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd-read-metadata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd-read-metadata
subjects:
  - kind: ServiceAccount
    name: fluentd
    namespace: logging
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app.kubernetes.io/name: fluentd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: fluentd
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluentd
    spec:
      serviceAccountName: fluentd
      terminationGracePeriodSeconds: 30
      tolerations:
        - operator: Exists
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.19.3-debian-opensearch-1.1
          imagePullPolicy: IfNotPresent
          env:
            # Свой конфиг из ConfigMap вместо встроенного в образ
            - name: FLUENTD_CONF
              value: custom/fluent.conf
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 24231
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            # Файлы в /var/log/pods принадлежат root: для чтения нужен uid 0.
            # Остальные привилегии отключены, /var/log смонтирован только на чтение.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          volumeMounts:
            - name: config
              mountPath: /fluentd/etc/custom
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/lib/fluentd
      volumes:
        - name: config
          configMap:
            name: fluentd-config
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        # pos-файлы и файловый буфер на ноде: переживают рестарт пода (нет потерь и дублей)
        - name: state
          hostPath:
            path: /var/lib/fluentd
            type: DirectoryOrCreate
