# Публикация UI наблюдаемости через тот же Gateway (маршрутизация по hostname).
# Namespace monitoring и logging помечены gateway-access=true, поэтому их маршруты принимаются Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: public-gw
      namespace: gateway-infra
  hostnames:
    - grafana.demo.local
  rules:
    - backendRefs:
        - name: kps-grafana
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs:
    - name: public-gw
      namespace: gateway-infra
  hostnames:
    - prometheus.demo.local
  rules:
    - backendRefs:
        - name: kps-prometheus
          port: 9090
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opensearch-dashboards
  namespace: logging
spec:
  parentRefs:
    - name: public-gw
      namespace: gateway-infra
  hostnames:
    - logs.demo.local
  rules:
    - backendRefs:
        - name: opensearch-dashboards
          port: 5601
