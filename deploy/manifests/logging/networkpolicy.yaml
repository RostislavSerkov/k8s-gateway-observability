# OpenSearch принимает запросы только от Fluentd и OpenSearch Dashboards;
# Dashboards доступен только через Envoy (Gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-ingress
  namespace: logging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: fluentd
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch-dashboards
      ports:
        - port: 9200
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opensearch-dashboards-ingress
  namespace: logging
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch-dashboards
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
      ports:
        - port: 5601
          protocol: TCP
