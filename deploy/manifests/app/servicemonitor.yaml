# Prometheus (Prometheus Operator) собирает метрики nginx-prometheus-exporter обеих версий.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hello
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          targetLabel: version
