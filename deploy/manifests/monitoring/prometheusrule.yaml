# Recording rules (HTTP SLI шлюза) и алерты для приложения, Gateway и конвейера логов.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gw-observability
  namespace: monitoring
spec:
  groups:
    - name: gateway.sli.rules
      interval: 30s
      rules:
        # RPS через Gateway к backend приложения по классам кодов ответа (2xx/4xx/5xx)
        - record: demo:envoy_upstream_rq:rate1m
          expr: sum by (envoy_cluster_name, envoy_response_code_class) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/demo/.*"}[1m]))
        # p95 latency backend (Envoy отдает upstream_rq_time в миллисекундах)
        - record: demo:envoy_upstream_rq_latency_ms:p95_1m
          expr: histogram_quantile(0.95, sum by (le, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~"httproute/demo/.*"}[1m])))
        # Доля 5xx
        - record: demo:envoy_upstream_rq_5xx:ratio5m
          expr: |
            sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/demo/.*", envoy_response_code_class="5"}[5m]))
            /
            clamp_min(sum(rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~"httproute/demo/.*"}[5m])), 1e-9)
        # RPS по версиям приложения (данные nginx-exporter) - видно распределение canary
        - record: demo:nginx_requests:rate1m
          expr: sum by (version) (rate(nginx_http_requests_total{namespace="demo"}[1m]))

    - name: demo.alerts
      rules:
        - alert: HelloMetricsTargetDown
          expr: up{namespace="demo", job=~"hello-v[12]"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Prometheus не может собрать метрики {{ $labels.pod }}"
            description: "Target {{ $labels.instance }} недоступен более 2 минут."
        - alert: HelloNoAvailableReplicas
          expr: kube_deployment_status_replicas_available{namespace="demo", deployment="hello-v1"} < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Нет доступных реплик hello-v1"
            description: "Основная версия приложения недоступна, Gateway будет отвечать 503."
        - alert: GatewayHigh5xxRatio
          expr: demo:envoy_upstream_rq_5xx:ratio5m > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Доля 5xx через Gateway > 5%"
            description: "Текущее значение: {{ $value | humanizePercentage }}."
        - alert: GatewayHighLatencyP95
          expr: demo:envoy_upstream_rq_latency_ms:p95_1m > 500
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "p95 latency backend > 500 мс"
            description: "{{ $labels.envoy_cluster_name }}: {{ $value }} мс."

    - name: logging.alerts
      rules:
        - alert: FluentdOutputErrors
          expr: increase(fluentd_output_status_num_errors[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fluentd не может отправить логи в OpenSearch"
            description: "Плагин {{ $labels.plugin_id }} на {{ $labels.pod }} получает ошибки."
        - alert: FluentdBufferGrowing
          expr: fluentd_output_status_buffer_queue_length > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Очередь буфера Fluentd растет"
            description: "OpenSearch не успевает принимать логи ({{ $value }} чанков в очереди)."
