# Fluentd: сбор логов контейнеров приложения и Envoy -> OpenSearch.
#
# Источник:  /var/log/containers/*.log на ноде (CRI-формат containerd)
# Обработка: парсинг CRI -> метаданные Kubernetes -> разбор JSON access-логов -> тип лога (access/error)
# Приемник:  OpenSearch, индексы k8s-logs-YYYY.MM.DD (просмотр: OpenSearch Dashboards, logs.demo.local)

<system>
  log_level info
</system>

# ---------- Метрики самого Fluentd для Prometheus (PodMonitor fluentd) ----------
<source>
  @type prometheus
  @id in_prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>
<source>
  @type prometheus_output_monitor
  @id in_prometheus_output_monitor
  interval 10
</source>
<source>
  @type prometheus_tail_monitor
  @id in_prometheus_tail_monitor
</source>

# ---------- Источник: логи подов приложения (namespace demo) и Envoy data plane ----------
<source>
  @type tail
  @id in_tail_containers
  path /var/log/containers/*_demo_*.log,/var/log/containers/envoy-*_envoy-gateway-system_envoy-*.log
  pos_file /var/lib/fluentd/containers.log.pos
  tag kube.*
  read_from_head true
  refresh_interval 5
  follow_inodes true
  <parse>
    # "2026-10-04T01:02:03.456Z stdout F <сообщение>"
    @type cri
  </parse>
</source>

# ---------- Метаданные Kubernetes: namespace, pod, container, labels ----------
<filter kube.**>
  @type kubernetes_metadata
  @id filter_kube_metadata
  skip_master_url true
  skip_container_metadata true
  annotation_match []
</filter>

# ---------- Разбор JSON (access-логи nginx и Envoy) в отдельные поля под ключом http ----------
<filter kube.**>
  @type parser
  @id filter_parse_json
  key_name message
  reserve_data true
  hash_value_field http
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# ---------- Нормализация: тип лога, имя приложения ----------
<filter kube.**>
  @type record_transformer
  @id filter_enrich
  enable_ruby true
  <record>
    log_type ${record["stream"] == "stderr" ? "error" : (record["http"] ? "access" : "app")}
    app ${(record.dig("kubernetes", "labels", "app_kubernetes_io/name") || record.dig("kubernetes", "labels", "app.kubernetes.io/name") || record.dig("kubernetes", "container_name")).to_s}
    cluster gw-observability
  </record>
</filter>

# ---------- Приемник: OpenSearch ----------
<match kube.**>
  @type opensearch
  @id out_opensearch
  host opensearch.logging.svc.cluster.local
  port 9200
  scheme http
  logstash_format true
  logstash_prefix k8s-logs
  logstash_dateformat %Y.%m.%d
  include_tag_key false
  suppress_type_name true
  reconnect_on_error true
  reload_on_failure false
  reload_connections false
  request_timeout 15s
  <buffer>
    @type file
    path /var/lib/fluentd/buffer/opensearch
    flush_mode interval
    flush_interval 2s
    flush_thread_count 2
    chunk_limit_size 4M
    total_limit_size 256M
    overflow_action drop_oldest_chunk
    retry_type exponential_backoff
    retry_max_interval 30s
    retry_forever true
  </buffer>
</match>
